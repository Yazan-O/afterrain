<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>The AfterRain loop: forecast, fog, request, sample, update, then a new forecast</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#f2b65a"/></marker></defs>
<path d="M526.9 91.7 A300 138 0 0 1 747.3 165.3" fill="none" stroke="#f2b65a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#h)"/>
<path d="M776.3 206.4 A300 138 0 0 1 692.1 325.6" fill="none" stroke="#f2b65a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#h)" stroke-dasharray="2 6"/>
<path d="M616.2 351.0 A300 138 0 0 1 343.8 351.0" fill="none" stroke="#f2b65a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#h)"/>
<path d="M267.9 325.6 A300 138 0 0 1 183.7 206.4" fill="none" stroke="#f2b65a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#h)"/>
<path d="M212.7 165.3 A300 138 0 0 1 433.1 91.7" fill="none" stroke="#f2b65a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#h)"/>
<circle cx="480.0" cy="90.0" r="16" fill="#f2b65a" opacity=".18"/><circle cx="480.0" cy="90.0" r="7" fill="#f2b65a"/>
<text x="480.0" y="24.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e6edf3">Forecast</text><text x="480.0" y="46.0" text-anchor="middle" font-size="15" fill="#9198a1">every stream, hour</text><text x="480.0" y="65.0" text-anchor="middle" font-size="15" fill="#9198a1">by hour, 7 days ahead</text>
<circle cx="765.3" cy="185.4" r="11" fill="none" stroke="#9198a1" stroke-width="2" stroke-dasharray="2 3"/>
<text x="795.3" y="171.4" text-anchor="start" font-size="21" font-weight="700" fill="#9198a1">Fog</text><text x="795.3" y="193.4" text-anchor="start" font-size="15" fill="#9198a1">nobody has measured</text><text x="795.3" y="212.4" text-anchor="start" font-size="15" fill="#9198a1">here after rain</text>
<circle cx="656.3" cy="339.6" r="16" fill="#f2b65a" opacity=".18"/><circle cx="656.3" cy="339.6" r="7" fill="#f2b65a"/>
<text x="656.3" y="383.6" text-anchor="middle" font-size="21" font-weight="700" fill="#e6edf3">Request</text><text x="656.3" y="405.6" text-anchor="middle" font-size="15" fill="#9198a1">one place,</text><text x="656.3" y="424.6" text-anchor="middle" font-size="15" fill="#9198a1">one time window</text>
<circle cx="303.7" cy="339.6" r="16" fill="#f2b65a" opacity=".18"/><circle cx="303.7" cy="339.6" r="7" fill="#f2b65a"/>
<text x="303.7" y="383.6" text-anchor="middle" font-size="21" font-weight="700" fill="#e6edf3">Sample</text><text x="303.7" y="405.6" text-anchor="middle" font-size="15" fill="#9198a1">a city team or</text><text x="303.7" y="424.6" text-anchor="middle" font-size="15" fill="#9198a1">a citizen takes it</text>
<circle cx="194.7" cy="185.4" r="16" fill="#f2b65a" opacity=".18"/><circle cx="194.7" cy="185.4" r="7" fill="#f2b65a"/>
<text x="164.7" y="171.4" text-anchor="end" font-size="21" font-weight="700" fill="#e6edf3">Update</text><text x="164.7" y="193.4" text-anchor="end" font-size="15" fill="#9198a1">the answer changes</text><text x="164.7" y="212.4" text-anchor="end" font-size="15" fill="#9198a1">on the spot</text>
<text x="480" y="222" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">A stream that knows where it is blind</text><text x="480" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">asks for its next sample.</text>
</svg>